[project]
name = "dora-eda"
version = "4.0.2"
description = "Exploratory data analysis and presentation tool"
authors = [
    {name = "Asif Sayyed",email = "asifdotexe@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.3,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pyarrow>=21.0.0,<22.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "typer>=0.19.2,<0.20.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/Asifdotexe/DORA"
Issues = "https://github.com/Asifdotexe/DORA/issues"

[project.optional-dependencies]
cli = [
    "tqdm>=4.67.1,<5.0.0",
    "kagglehub==0.3.13",
    "textual>=8.2.8",
]
ui = [
    "streamlit>=1.53.0,<2.0.0",
    "matplotlib>=3.10.6,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "kagglehub==0.3.13",
]
all = [
    "dora-eda[cli,ui]"
]
[project.scripts]
dora = "dora.main:main"

[dependency-groups]
dev = [
    "prek",
    "ruff>=0.9.0",
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.1.0",
    "snakeviz>=2.2.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "B008",   # function-call-in-default-argument (B008)
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dora"]
